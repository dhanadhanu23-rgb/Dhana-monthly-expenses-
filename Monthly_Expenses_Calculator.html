<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Expenses Calculator</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f8;color:#222;margin:0;padding:15px}.app{max-width:1000px;margin:auto}.head{background:#1f4e79;color:#fff;padding:20px;border-radius:15px;margin-bottom:15px}.head h1{margin:0 0 6px;font-size:24px}.box{background:#fff;padding:16px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:bold;font-size:13px;display:block;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}button{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#1f4e79;color:#fff}.green{background:#16833a;color:#fff}.red{background:#d93025;color:#fff}.gray{background:#777;color:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.card{background:#fff;padding:16px;border-radius:15px;box-shadow:0 2px 8px #0001}.title{font-size:13px;color:#666}.value{font-size:21px;font-weight:bold;margin-top:7px}.income{color:#16833a}.expense{color:#d93025}.balance{color:#1f4e79}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:650px}th{background:#1f4e79;color:#fff;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #eee}.tablewrap{overflow:auto}.search{margin-bottom:12px}.cat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.amount{font-weight:bold;color:#d93025}.small{padding:7px 10px;font-size:12px}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.buttons button{width:100%}}
</style>
</head>
<body>
<div class="app">
<div class="head"><h1>💰 Monthly Expenses Calculator</h1><div>Manage your monthly income and expenses</div></div>

<div class="box">
<label>Select Month</label><input type="month" id="month">
</div>

<div class="summary">
<div class="card"><div class="title">Monthly Income</div><div class="value income" id="incomeTotal">₹0.00</div></div>
<div class="card"><div class="title">Total Expenses</div><div class="value expense" id="expenseTotal">₹0.00</div></div>
<div class="card"><div class="title">Remaining Balance</div><div class="value balance" id="balance">₹0.00</div></div>
<div class="card"><div class="title">Expenses Count</div><div class="value" id="count">0</div></div>
</div>

<div class="box">
<h2>Monthly Income</h2>
<div class="grid"><div><label>Income Amount (₹)</label><input type="number" id="income" min="0" step="0.01"></div></div>
<div class="buttons"><button class="green" onclick="saveIncome()">Save Income</button></div>
</div>

<div class="box">
<h2 id="formTitle">Add Expense</h2>
<div class="grid">
<div><label>Date</label><input type="date" id="date"></div>
<div><label>Category</label><select id="category">
<option>Food</option><option>Groceries</option><option>Rent</option><option>Electricity</option><option>Water</option><option>Internet</option><option>Mobile</option><option>Transport</option><option>Fuel</option><option>Medical</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>EMI</option><option>Insurance</option><option>Other</option>
</select></div>
<div style="grid-column:1/-1"><label>Description</label><input id="description" placeholder="Example: Grocery shopping"></div>
<div><label>Amount (₹)</label><input type="number" id="amount" min="0" step="0.01"></div>
</div>
<div class="buttons"><button class="primary" id="saveBtn" onclick="saveExpense()">Add Expense</button><button class="gray" onclick="cancelEdit()">Cancel</button></div>
</div>

<div class="box">
<h2>Expense List</h2>
<input class="search" id="search" placeholder="Search expenses..." oninput="render()">
<div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="list"></tbody></table></div>
</div>

<div class="box"><h2>Category-wise Expenses</h2><div id="categories"></div></div>

<div class="box"><h2>Data Management</h2><div class="buttons"><button class="green" onclick="exportCSV()">Export CSV</button><button class="red" onclick="clearAll()">Clear All Data</button></div></div>
</div>

<script>
let expenses=JSON.parse(localStorage.getItem("me_expenses")||"[]");
let incomes=JSON.parse(localStorage.getItem("me_incomes")||"{}");
let editId=null;
const $=id=>document.getElementById(id);
const now=new Date();
const monthKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
$("month").value=monthKey;
$("date").value=now.toISOString().slice(0,10);
$("month").onchange=()=>{loadIncome();render()};

function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function safe(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function loadIncome(){let m=$("month").value;$("income").value=incomes[m]||"";updateSummary()}
function saveIncome(){let m=$("month").value;incomes[m]=Number($("income").value)||0;localStorage.setItem("me_incomes",JSON.stringify(incomes));render();alert("Income saved.")}
function saveExpense(){
 let date=$("date").value,category=$("category").value,description=$("description").value.trim(),amount=Number($("amount").value);
 if(!date||!description||amount<=0){alert("Please enter date, description and a valid amount.");return}
 if(editId!==null){let e=expenses.find(x=>x.id===editId);if(e)Object.assign(e,{date,category,description,amount});editId=null;$("formTitle").textContent="Add Expense";$("saveBtn").textContent="Add Expense"}
 else expenses.push({id:Date.now(),date,category,description,amount});
 localStorage.setItem("me_expenses",JSON.stringify(expenses));clearForm();render();
}
function clearForm(){$("description").value="";$("amount").value="";$("date").value=new Date().toISOString().slice(0,10)}
function cancelEdit(){editId=null;$("formTitle").textContent="Add Expense";$("saveBtn").textContent="Add Expense";clearForm()}
function editExpense(id){let e=expenses.find(x=>x.id===id);if(!e)return;$("date").value=e.date;$("category").value=e.category;$("description").value=e.description;$("amount").value=e.amount;editId=id;$("formTitle").textContent="Edit Expense";$("saveBtn").textContent="Update Expense";scrollTo({top:0,behavior:"smooth"})}
function deleteExpense(id){if(!confirm("Delete this expense?"))return;expenses=expenses.filter(x=>x.id!==id);localStorage.setItem("me_expenses",JSON.stringify(expenses));render()}
function updateSummary(){
 let m=$("month").value,arr=expenses.filter(x=>x.date.slice(0,7)===m),total=arr.reduce((s,x)=>s+x.amount,0),inc=Number(incomes[m]||0);
 $("incomeTotal").textContent=money(inc);$("expenseTotal").textContent=money(total);$("balance").textContent=money(inc-total);$("count").textContent=arr.length
}
function render(){
 let m=$("month").value,q=$("search").value.toLowerCase(),arr=expenses.filter(x=>x.date.slice(0,7)===m&&(x.description.toLowerCase().includes(q)||x.category.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
 $("list").innerHTML=arr.length?arr.map(x=>`<tr><td>${x.date}</td><td>${safe(x.category)}</td><td>${safe(x.description)}</td><td class="amount">${money(x.amount)}</td><td><button class="primary small" onclick="editExpense(${x.id})">Edit</button> <button class="red small" onclick="deleteExpense(${x.id})">Delete</button></td></tr>`).join(""):`<tr><td colspan="5" style="text-align:center;padding:25px">No expenses found.</td></tr>`;
 let cats={};expenses.filter(x=>x.date.slice(0,7)===m).forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);
 $("categories").innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cat"><b>${safe(k)}</b><span class="amount">${money(v)}</span></div>`).join("")||"No category expenses yet.";
 updateSummary();
}
function exportCSV(){
 let m=$("month").value,arr=expenses.filter(x=>x.date.slice(0,7)===m);if(!arr.length){alert("No expenses to export.");return}
 let csv="Date,Category,Description,Amount\n"+arr.map(x=>`"${x.date}","${x.category.replaceAll('"','""')}","${x.description.replaceAll('"','""')}","${x.amount}"`).join("\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Expenses_"+m+".csv";a.click();URL.revokeObjectURL(a.href)
}
function clearAll(){if(!confirm("Delete ALL income and expense data?"))return;expenses=[];incomes={};localStorage.removeItem("me_expenses");localStorage.removeItem("me_incomes");loadIncome();render()}
loadIncome();render();
</script>
</body>
</html>
